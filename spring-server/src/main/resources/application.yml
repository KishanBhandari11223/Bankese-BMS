spring:
  application:
    name: bms-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:bms_app}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 900